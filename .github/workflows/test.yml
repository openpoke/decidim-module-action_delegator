name: "[CI] Test"
on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches-ignore:
      - "chore/l10n*"

env:
  CI: 1
  SIMPLECOV: 1
  NODE_VERSION: 22.14.0
  RUBY_VERSION: 3.4.7
  DISPLAY: ":99"
  RUBYOPT: '-W:no-deprecated'
  RAILS_ENV: test
  NODE_ENV: test
  DISABLE_SPRING: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-report:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - run: |
          sudo apt-get update; sudo apt-get -f install imagemagick

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm get cache)-action_delegator" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-
      - run: bundle exec rake test_app
        name: Create test app

      - run: mkdir -p ./spec/decidim_dummy_app/tmp/screenshots
        name: Create the screenshots folder

      - uses: nanasess/setup-chromedriver@v2

      - run: RAILS_ENV=test bundle exec rails shakapacker:compile
        name: Precompile assets
        working-directory: ./spec/decidim_dummy_app/

      - run: bundle exec rspec
        name: RSpec

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ./spec/decidim_dummy_app/tmp/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test logs
          path: ./spec/decidim_dummy_app/log/test.log
          if-no-files-found: ignore
